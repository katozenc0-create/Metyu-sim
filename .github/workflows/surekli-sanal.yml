# Sanal para portföyü: her 6 saatte bir ~5,5 saat çalışır, durumu "veri" dalına kaydeder, sonraki çalışma oradan devam eder.
# Yalnızca sanal para: anahtar, hesap ya da emir yok. Çalışmalar arasında kısa boşluklar olur (o sürede stoplar izlenmez,
# program açılınca ilk fiyatta kontrol eder). Sonuçlar: veri dalındaki metyu-log.txt, metyu-trades.csv, metyu-state.json, raporlar/.
name: Sürekli sanal çalışma
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: surekli-sanal
  cancel-in-progress: false
jobs:
  calis:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Önceki durumu geri yükle
        run: |
          mkdir -p data
          REMOTE="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$REMOTE" veri >/dev/null 2>&1; then
            git clone -q --depth 1 --branch veri "$REMOTE" veri-kopya
            rm -rf veri-kopya/.git
            cp -r veri-kopya/. data/
            echo "Önceki durum geri yüklendi:"; ls data
          else
            echo "Önceki durum yok; yeni sanal portföy başlayacak."
          fi
      - name: Programı çalıştır (5,5 saat)
        run: |
          METYU_DATA_DIR="$PWD/data" timeout --signal=TERM 335m node metyu-runner.mjs --port 0 > konsol.txt 2>&1 || true
          tail -n 200 konsol.txt > data/konsol-son.txt
      - name: Durumu veri dalına kaydet
        if: always()
        run: |
          cd data
          rm -f metyu.lock
          git init -q -b veri
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Durum $(date -u +%Y-%m-%d-%H%M)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" veri
