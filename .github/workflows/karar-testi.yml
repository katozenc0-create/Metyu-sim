# Karar testi: ağ kullanmaz, yaklaşık 2 dakika sürer. Risk kurallarını, öğrenicinin rastgele veride yanlış alarm
# oranını, gerçek eğilimi bulabildiğini ve bozuk kayıt dosyasının reddedildiğini sınar. Her değişiklikte çalışır.
name: Karar testi
on:
  push:
    branches: [main]
    paths: ['simulator.html', 'metyu-runner.mjs', 'test/**', '.github/workflows/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: karar-testi-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Sözdizimi
        run: node --check metyu-runner.mjs
      - name: Karar testi
        run: node test/karar.mjs
      - name: Ajan testi (sahte borsa)
        run: node test/ajan.mjs
